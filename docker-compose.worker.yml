# ---------------------------------------------------------------------------
# SalamDesk — VPS stack (worker only)
#
# Run on your VPS with:
#   docker compose -f docker-compose.worker.yml up -d --build
#
# Postgres and Redis are both managed externally:
#   - DATABASE_URL → Neon / Supabase
#   - REDIS_URL    → Upstash (TCP endpoint, rediss://) — shared with Vercel
#
# Both the Vercel app (producer) and this worker (consumer) point at the SAME
# Upstash Redis, which is how enqueued jobs reach the worker.
# ---------------------------------------------------------------------------

services:
  worker:
    container_name: salamdesk-worker
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    env_file:
      - .env.worker
    environment:
      KNOWLEDGE_INGESTION_TMP_DIR: /app/tmp
    volumes:
      # Persist WhatsApp session so you don't re-scan the QR on every restart.
      - wa-auth:/app/wa_auth
    # First boot prints a QR in the logs — scan it with WhatsApp:
    #   docker compose -f docker-compose.worker.yml logs -f worker

  # -------------------------------------------------------------------------
  # Vector — tails the worker container and forwards its Pino JSON logs to
  # Axiom. Config lives in ./vector.toml. Reads logs via the Docker socket;
  # the worker itself is untouched. Set AXIOM_TOKEN / AXIOM_DATASET in
  # .env.worker (use the SAME dataset as the Vercel drain so web + worker
  # logs pool together — filter by the `service` field).
  # -------------------------------------------------------------------------
  vector:
    image: timberio/vector:latest-debian
    container_name: salamdesk-vector
    restart: unless-stopped
    depends_on:
      - worker
    env_file:
      - .env.worker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./vector.toml:/etc/vector/vector.toml:ro

volumes:
  wa-auth:
